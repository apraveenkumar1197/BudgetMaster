# ── LOCAL DEVELOPMENT ──────────────────────────────────────────────────────────
# Builds laravel-php/react-app from source and runs a local MySQL container.
# Run standalone: `docker compose up -d` (auto-merges docker-compose.override.yml).
# For production, use docker-compose.prod.yml instead — it is a fully separate,
# standalone file (prebuilt Docker Hub images, no db service) and is never
# combined with this file.
services:

  # ── MySQL (Laravel users / auth tables) ─────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: budgetmaster_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-budgetmaster}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-budgetmaster}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - main
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Laravel (Octane/RoadRunner) ───────────────────────────────────────────────
  laravel-php:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    container_name: budgetmaster_php
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-budgetmaster}
      DB_USERNAME: ${DB_USERNAME:-budgetmaster}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      ROOT_PATH: ${ROOT_PATH:-http://laravel-nginx/}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp.mailgun.org}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-BudgetMaster}
    volumes:
      - laravel_storage:/var/www/storage
    networks:
      - main
    depends_on:
      db:
        condition: service_healthy

  # ── Nginx (Laravel API) ──────────────────────────────────────────────────────
  laravel-nginx:
    image: nginx:alpine
    container_name: budgetmaster_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ./laravel/public:/var/www/public:ro
      - ./docker/nginx/laravel.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - main
    depends_on:
      - laravel-php

  # ── React SPA ────────────────────────────────────────────────────────────────
  react-app:
    build:
      context: ./reactjs
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-http://localhost:8080/api/}
    container_name: budgetmaster_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - main

networks:
  main:
    name: main
    external: true

volumes:
  db_data:
  laravel_storage:
