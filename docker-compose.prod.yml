# ── PRODUCTION ───────────────────────────────────────────────────────────────
# Fully standalone — do NOT combine with docker-compose.yml. Pulls prebuilt
# images from Docker Hub and connects to an external MySQL server (no db
# service is defined here). Run: `docker compose -f docker-compose.prod.yml up -d`
services:

  # ── Laravel (Octane/RoadRunner, prebuilt image) ─────────────────────────────
  laravel-php:
    image: ${API_IMAGE:-docker.io/apraveenkumar1197/budgetmaster-api}:${API_IMAGE_TAG:-latest}
    container_name: budgetmaster_php
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-budgetmaster}
      DB_USERNAME: ${DB_USERNAME:-budgetmaster}
      DB_PASSWORD: ${DB_PASSWORD}
      ROOT_PATH: ${ROOT_PATH:-http://laravel-nginx/}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp.mailgun.org}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-BudgetMaster}
      BACKUP_DRIVER: ${BACKUP_DRIVER:-email}
      DROPBOX_CLIENT_ID: ${DROPBOX_CLIENT_ID}
      DROPBOX_CLIENT_SECRET: ${DROPBOX_CLIENT_SECRET}
      DROPBOX_REFRESH_TOKEN: ${DROPBOX_REFRESH_TOKEN}
    volumes:
      - laravel_storage:/var/www/storage
      # Also mounted here (not just on nginx) so the named volume gets
      # populated from this image's /var/www/public on first start.
      - laravel_public:/var/www/public
    networks:
      - main

  # ── Nginx (Laravel API) ──────────────────────────────────────────────────────
  laravel-nginx:
    image: ${NGINX_IMAGE:-docker.io/apraveenkumar1197/budgetmaster-nginx}:${NGINX_IMAGE_TAG:-latest}
    container_name: budgetmaster_api
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
    ports:
      - "${API_PORT:-4396}:80"
    volumes:
      - laravel_public:/var/www/public:ro
    networks:
      - main
    depends_on:
      - laravel-php

  # ── React SPA (prebuilt image) ───────────────────────────────────────────────
  react-app:
    image: ${FRONTEND_IMAGE:-docker.io/apraveenkumar1197/budgetmaster-frontend}:${FRONTEND_IMAGE_TAG:-latest}
    container_name: budgetmaster_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4383}:80"
    networks:
      - main

networks:
  main:
    name: main
    external: true

volumes:
  laravel_storage:
  laravel_public:
